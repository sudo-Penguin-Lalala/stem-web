<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô hình lối sống xanh - THPT Nguyễn Trãi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topbar">
    <img src="assets/logo.jpg" alt="Logo lớp 10A9" class="logo">
  </nav>

  <header class="hero">
    <div class="hero-content">
      <p class="school">THPT Nguyễn Trãi — Lớp 10A9</p>
      <h1>Mô hình lối sống xanh</h1>
      <p class="subtitle">✨ Sử dụng năng lượng tái tạo ✨</p>
      <p class="slogan">Slogan: Năng lượng sạch — Cuộc sống xanh</p>
      <p class="teacher">Giáo viên hướng dẫn: Vũ Thị Hường</p>
      <div class="scroll-arrow">
        <span>&#8595;</span>
      </div>
    </div>
  </header>

  <main class="bento">
    <div class="bento-card large reveal">
      <video controls preload="metadata">
        <source src="assets/video.mp4" type="video/mp4">
      </video>
      <p class="card-label">Video giới thiệu</p>
    </div>
    <div class="bento-card reveal">
      <img src="assets/house.jpg" alt="Mô hình nhà năng lượng xanh">
      <p class="card-label">Nhà năng lượng xanh</p>
    </div>
    <div class="bento-card reveal">
      <img src="assets/turbine.jpg" alt="Tuabin gió">
      <p class="card-label">Tuabin gió</p>
    </div>
    <div class="bento-card reveal">
      <img src="assets/garden.jpg" alt="Vườn xanh">
      <p class="card-label">Vườn xanh</p>
    </div>
    <div class="bento-card reveal">
      <img src="assets/bike.jpg" alt="Xe đạp - phương tiện xanh">
      <p class="card-label">Phương tiện xanh</p>
    </div>
  </main>

  <footer>
    <p>made with ❤️ by palera1nx</p>
  </footer>

  <script>
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  </script>
</body>
</html>
