<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô hình lối sống xanh - THPT Nguyễn Trãi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topbar">
    <img src="assets/logo.jpg" alt="Logo lớp 10A9" class="logo">
  </nav>

  <header class="hero">
    <div class="hero-content">
      <p class="school">THPT Nguyễn Trãi — Lớp 10A9</p>
      <h1>Mô hình lối sống xanh</h1>
      <p class="subtitle">✨ Sử dụng năng lượng tái tạo ✨</p>
      <p class="slogan">Slogan: Năng lượng sạch — Cuộc sống xanh</p>
      <p class="teacher">Giáo viên hướng dẫn: Vũ Thị Hường</p>
      <div class="hero-buttons">
        <button class="btn" data-target="video-section">🎬 Video giới thiệu</button>
        <button class="btn" data-target="gallery-section">🖼️ Hình ảnh sản phẩm</button>
      </div>
    </div>
  </header>

  <section id="video-section" class="content-section hidden">
    <div class="section-card">
      <h2>Video giới thiệu sản phẩm</h2>
      <video controls preload="metadata">
        <source src="assets/video.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <section id="gallery-section" class="content-section hidden">
    <div class="section-card">
      <h2>Hình ảnh sản phẩm</h2>
      <div class="gallery-grid">
        <img src="assets/house.jpg" alt="Mô hình nhà năng lượng xanh">
        <img src="assets/turbine.jpg" alt="Tuabin gió">
        <img src="assets/garden.jpg" alt="Vườn xanh">
        <img src="assets/bike.jpg" alt="Xe đạp - phương tiện xanh">
      </div>
    </div>
  </section>

  <footer>
    <p>made with ❤️ by palera1nx</p>
  </footer>

  <script>
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        const isVisible = !target.classList.contains('hidden');
        document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
        if (!isVisible) {
          target.classList.remove('hidden');
          requestAnimationFrame(() => {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        }
      });
    });
  </script>
</body>
</html>
