<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô hình lối sống xanh - THPT Nguyễn Trãi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topbar">
    <img src="assets/logo.jpg" alt="Logo lớp 10A9" class="logo">
  </nav>

  <header class="hero">
    <div class="floating-icons" aria-hidden="true"></div>
    <div class="hero-content">
      <p class="school">THPT Nguyễn Trãi — Lớp 10A9</p>
      <h1>Mô hình lối sống xanh</h1>
      <p class="subtitle">✨ Sử dụng năng lượng tái tạo ✨</p>
      <p class="slogan">Slogan: Năng lượng sạch — Cuộc sống xanh</p>
      <p class="teacher">Giáo viên hướng dẫn: Vũ Thị Hường</p>
      <div class="scroll-arrow">
        <span>&#8595;</span>
      </div>
    </div>
  </header>

  <main class="bento">
    <div class="bento-card large reveal">
      <video controls preload="metadata" poster="assets/thumb.jpg">
        <source src="assets/video.mp4" type="video/mp4">
      </video>
      <p class="card-label">Video giới thiệu</p>
    </div>
    <div class="bento-card reveal">
      <img src="assets/house.jpg" alt="Mô hình nhà năng lượng xanh">
      <p class="card-label">Nhà năng lượng xanh</p>
    </div>
    <div class="bento-card reveal">
      <img src="assets/turbine.jpg" alt="Tuabin gió">
      <p class="card-label">Tuabin gió</p>
    </div>
    <div class="bento-card reveal">
      <img src="assets/garden.jpg" alt="Vườn xanh">
      <p class="card-label">Vườn xanh</p>
    </div>
    <div class="bento-card reveal">
      <img src="assets/bike.jpg" alt="Xe đạp - phương tiện xanh">
      <p class="card-label">Phương tiện xanh</p>
    </div>
  </main>

  <footer>
    <p>made with ❤️ by NNT</p>
  </footer>

  <script>
    const icons = ['☀️','🌱','💨','🔋','♻️','🌍','💡','🚲','🌿','⚡','🏡','🌻','🍃','💧','🌞'];
    const container = document.querySelector('.floating-icons');
    const isMobile = window.innerWidth <= 600;
    const count = isMobile ? 50 : 150;
    for (let i = 0; i < count; i++) {
      const span = document.createElement('span');
      span.textContent = icons[i % icons.length];
      span.style.left = (Math.random() * 110 - 5) + '%';
      span.style.bottom = (Math.random() * 120 - 20) + '%';
      const duration = 18 + Math.random() * 8;
      span.style.animationDuration = duration + 's';
      span.style.animationDelay = (-Math.random() * duration) + 's';
      span.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
      container.appendChild(span);
    }

    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          e.target.style.opacity = '';
          e.target.style.transform = '';
        } else {
          e.target.classList.remove('visible');
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    const fadeObs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const ratio = e.intersectionRatio;
        if (ratio < 0.3) {
          const progress = ratio / 0.3;
          e.target.style.opacity = progress;
          e.target.style.transform = `translateY(${(1 - progress) * 20}px) scale(${0.95 + progress * 0.05})`;
        } else {
          e.target.style.opacity = '';
          e.target.style.transform = '';
        }
      });
    }, { threshold: Array.from({ length: 20 }, (_, i) => i / 20) });
    document.querySelectorAll('.reveal').forEach(el => fadeObs.observe(el));
  </script>
</body>
</html>
